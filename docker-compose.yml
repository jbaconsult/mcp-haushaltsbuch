# =============================================================================
# Entwicklungsstack
#
#   cp .env.example .env    # Platzhalter ausfüllen
#   make hoch
#
# OIDC läuft gegen den externen Keycloak aus OIDC_AUTH_SERVER_URL. Es gibt genau
# einen Realm auf auth.kumbuka.ai, ohne Trennung zwischen Entwicklung und
# Produktion - siehe ADR-0009. Wer ohne externen Identity-Provider arbeiten will,
# nimmt docker-compose.ci.yml: der bringt einen eigenen Keycloak mit.
#
# Für die tägliche Arbeit ist der Quarkus Dev Mode angenehmer - er startet
# Postgres selbst und lädt Änderungen ohne Neustart. Siehe make backend-dev.
# =============================================================================

name: haushaltsbuch

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haushaltsbuch}
      POSTGRES_USER: ${POSTGRES_USER:-haushaltsbuch_eigentuemer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - siehe .env.example}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 legt die Daten in ein versionsspezifisches Unterverzeichnis.
      # Der Mount gehört deshalb auf /var/lib/postgresql, NICHT auf .../data -
      # sonst findet das Image die Daten an der alten Stelle, erkennt sie als
      # verwaist und verweigert den Start.
      - postgres-daten:/var/lib/postgresql
    healthcheck:
      # Mit -U und -d, sonst prüft pg_isready gegen die Standarddatenbank und
      # meldet "bereit", bevor die eigentliche Datenbank angelegt ist.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haushaltsbuch_eigentuemer} -d ${POSTGRES_DB:-haushaltsbuch}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: app/src/main/docker/Dockerfile
    depends_on:
      postgres:
        # Nicht nur "started": Flyway migriert beim Anwendungsstart und scheitert
        # gegen eine Datenbank, die noch hochfährt.
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-haushaltsbuch}
      POSTGRES_USER: ${POSTGRES_USER:-haushaltsbuch_eigentuemer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - siehe .env.example}
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:?OIDC_AUTH_SERVER_URL fehlt - siehe .env.example}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-haushaltsbuch-backend}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET fehlt - siehe .env.example}

      # --- Bankzugang ---------------------------------------------------------
      # Ohne diese Werte startet die Anwendung normal und meldet beim ersten
      # Versuch, dass der Zugang nicht eingerichtet ist. Deshalb hier KEIN
      # Pflicht-Platzhalter mit ":?" - eine Anwendung, die wegen eines fehlenden
      # Bankzugangs nicht hochkommt, nimmt Dashboard, Ledger und Anmeldung mit.
      #
      # Auch die Anwendungs-ID kommt aus der Umgebung. Sie ist kein Geheimnis,
      # sondern nur die Schluesselkennung im JWT-Kopf - aber jede
      # Fremdinstallation bringt eine eigene mit.
      BANKZUGANG_BASIS_URL: ${BANKZUGANG_BASIS_URL:-https://api.enablebanking.com}
      BANKZUGANG_ANWENDUNGS_ID: ${BANKZUGANG_ANWENDUNGS_ID:-}
      BANKZUGANG_RUECKLEITUNG: ${BANKZUGANG_RUECKLEITUNG:-http://localhost:3000/bank/rueckleitung}
      BANKZUGANG_GUELTIGKEIT_TAGE: ${BANKZUGANG_GUELTIGKEIT_TAGE:-180}
      BANKZUGANG_LAND: ${BANKZUGANG_LAND:-DE}
      # Pfad INNERHALB des Containers. Der Schluessel wird eingehaengt, nicht
      # eingebacken - ein Schluessel im Abbild liegt in jeder Registry, aus der
      # jemand das Abbild zieht.
      BANKZUGANG_SCHLUESSEL_PFAD: /run/secrets/bankzugang-schluessel.pem
    volumes:
      # Nur lesend. Die Datei liegt ausserhalb des Repositoriums; der Pfad kommt
      # aus BANKZUGANG_SCHLUESSEL_DATEI und hat absichtlich keinen Vorgabewert im
      # Repositorium - er zeigt auf die Maschine, nicht auf das Projekt.
      - ${BANKZUGANG_SCHLUESSEL_DATEI:-./.bankzugang-schluessel.pem}:/run/secrets/bankzugang-schluessel.pem:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Docker-interner Name. Der Browser löst ihn nicht auf - er muss es auch
      # nicht, weil er ausschliesslich mit dem BFF spricht.
      BACKEND_BASE_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-daten:
