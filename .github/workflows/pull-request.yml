# =============================================================================
# Qualitätspipeline
#
#   backend  ─┐
#   frontend ─┼─► images ──► gate
#   stapel   ─┘
#
# Als Required Check in der Branch-Protection wird NUR "gate" eingetragen.
# Trüge man jeden einzelnen Job ein, müsste die Branch-Protection bei jedem
# neuen oder umbenannten Job angefasst werden - und vergisst man es, ist der
# neue Job zwar rot, blockiert den Merge aber nicht.
# =============================================================================

name: Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Ein Lauf gegen einen überholten Commit hilft niemandem und belegt nur einen
# Runner. Auf main wird nicht abgebrochen - dort soll jeder Stand geprüft sein.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # fetch-depth: 0 wegen Sonar. Die Analyse braucht die Historie, um "neuen
      # Code" von altem zu unterscheiden - mit einem flachen Klon hält sie alles
      # für neu, und die Schwelle auf neuem Code wird bedeutungslos.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: JDK einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Sonar-Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      # Deckt Kompilierung, Spotless-Formatprüfung, Unit-Tests und die
      # Integrationstests ab - darunter der RLS-Test, der über Quarkus Dev
      # Services echtes PostgreSQL startet. Docker steht auf den Runnern bereit.
      # JaCoCo hängt sich an und schreibt die Abdeckung je Modul.
      - name: Bauen und testen
        working-directory: backend
        run: ./mvnw -B verify

      # Getrennter Aufruf, nicht "verify sonar:sonar" in einem: die Analyse soll
      # laufen, nachdem die Tests durch sind, und ihr Fehlschlag soll vom
      # Testfehlschlag unterscheidbar bleiben.
      #
      # Fork-Pull-Requests haben keinen Zugriff auf das Geheimnis. Der Versuch
      # würde den Lauf rot färben, ohne dass jemand etwas dagegen tun könnte.
      - name: SonarCloud-Analyse
        id: sonar
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Ohne dieses Token findet Sonar die Pull-Request-Nummer nicht und
          # analysiert gegen den falschen Bezugspunkt.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Der haeufigste Fehlschlag hier hat eine Ursache ausserhalb des Repos und
        # eine Meldung, die zwischen zweihundert Maven-Zeilen untergeht. Deshalb
        # wird sie herausgefischt und als Annotation wiederholt - sonst sucht der
        # Naechste sie noch einmal.
        run: |
          set -o pipefail
          if ! ./mvnw -B sonar:sonar 2>&1 | tee sonar.log; then
            if grep -q "Automatic Analysis is enabled" sonar.log; then
              echo "::error::In SonarCloud laeuft noch die automatische Analyse. Beides gleichzeitig geht nicht - abschalten unter Administration -> Analysis Method, dann diesen Lauf wiederholen."
            fi
            exit 1
          fi

      # Bewusst in Shell statt über sonarqube-quality-gate-action: dieselbe
      # Begründung wie bei den Docker-Actions weiter unten - eine Action, die
      # erst heruntergeladen werden muss, ist ein Ausfallgrund mehr.
      #
      # report-task.txt entsteht bei der Analyse und enthält die URL des
      # Auswertungsauftrags. Erst wenn der durch ist, steht die Schwelle fest.
      - name: Qualitätsschwelle abwarten
        if: ${{ steps.sonar.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          bericht=backend/target/sonar/report-task.txt
          if [ ! -f "$bericht" ]; then
            echo "::error::$bericht fehlt - die Analyse hat nichts hinterlassen."
            exit 1
          fi

          auftrag=$(grep '^ceTaskUrl=' "$bericht" | cut -d= -f2-)
          echo "Auswertungsauftrag: $auftrag"

          for versuch in $(seq 1 60); do
            zustand=$(curl -sf -u "${SONAR_TOKEN}:" "$auftrag" | jq -r .task.status)
            case "$zustand" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                echo "::error::Auswertung endete mit $zustand."
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done

          if [ "$zustand" != "SUCCESS" ]; then
            echo "::error::Auswertung nach fünf Minuten nicht abgeschlossen."
            exit 1
          fi

          analyse=$(curl -sf -u "${SONAR_TOKEN}:" "$auftrag" | jq -r .task.analysisId)
          schwelle=$(curl -sf -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=${analyse}")

          echo "$schwelle" | jq .
          zustand=$(echo "$schwelle" | jq -r .projectStatus.status)

          if [ "$zustand" != "OK" ]; then
            echo "::error::Qualitätsschwelle nicht bestanden ($zustand)."
            echo "$schwelle" | jq -r '.projectStatus.conditions[] | select(.status != "OK")
              | "  \(.metricKey): \(.actualValue) (verlangt \(.comparator) \(.errorThreshold))"'
            exit 1
          fi

          echo "Qualitätsschwelle bestanden."

      # Auch bei rotem Lauf hochladen. Ein Fehlschlag ohne Bericht ist doppelt
      # ärgerlich.
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-testberichte
          path: backend/**/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Anwendungsartefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: backend-quarkus-app
          path: backend/app/target/quarkus-app/
          retention-days: 7

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      # Reihenfolge nach Kosten: der Build ist der teuerste Schritt und steht am
      # Ende. Ein Typfehler soll nach zwanzig Sekunden auffallen, nicht nach zwei
      # Minuten.
      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings 0

      - name: Typen prüfen
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Bauen
        working-directory: frontend
        run: npm run build

      - name: Anwendungsartefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: frontend-standalone
          path: |
            frontend/.next/standalone/
            frontend/.next/static/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Prüft, was sonst niemand prüft: dass Backend, Postgres und Keycloak
  # tatsächlich zusammen starten und das Backend seinen Realm findet.
  #
  # Läuft gegen den eigenen Keycloak aus docker-compose.ci.yml, nicht gegen
  # auth.jbaconsult.com. Ein Pull Request, der rot wird, weil ein externer
  # Identity-Provider gerade neu startet, kostet mehr Vertrauen in die Pipeline,
  # als die Realitätsnähe wert ist.
  stapel:
    name: Stapel startet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Stapel starten
        run: docker compose -f docker-compose.ci.yml up -d --build --wait --wait-timeout 420

      # Eigener Schritt, weil quarkus.flyway.locations eine Build-Zeit-Property
      # ist und sich nicht per Umgebungsvariable umstellen lässt. Näheres in
      # docker-compose.ci.yml.
      - name: Demodaten laden
        run: docker compose -f docker-compose.ci.yml run --rm demodaten

      # Ohne gültiges Token muss das Backend abweisen. Käme hier eine 200,
      # wäre die Anmeldepflicht nicht aktiv - und das wäre der schwerwiegendste
      # denkbare Konfigurationsfehler.
      - name: Anmeldepflicht prüfen
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/konten)
          echo "GET /api/konten ohne Token -> $status"
          if [ "$status" != "401" ]; then
            echo "::error::Erwartet wurde 401, bekommen $status. Die Anmeldepflicht greift nicht."
            exit 1
          fi

      - name: Anmeldung und Zugriffskontrolle prüfen
        run: |
          set -euo pipefail

          token=$(curl -sf -X POST \
            http://localhost:8081/realms/haushaltsbuch/protocol/openid-connect/token \
            -d grant_type=password \
            -d client_id=haushaltsbuch-bff \
            -d client_secret=ci-geheimnis-bff \
            -d username=demo-eins \
            -d password=ci-passwort | jq -r .access_token)

          konten=$(curl -sf -H "Authorization: Bearer $token" http://localhost:8080/api/konten)
          echo "$konten" | jq .

          # Demo Eins hat Zugriff auf genau vier Konten.
          anzahl=$(echo "$konten" | jq 'length')
          if [ "$anzahl" != "4" ]; then
            echo "::error::Erwartet wurden 4 Konten, geliefert wurden $anzahl."
            exit 1
          fi

          # "Giro Demo Zwei" gehoert ausschliesslich Demo Zwei. Dass es hier nicht
          # auftaucht, ist die harte Anforderung aus HB-05 - genau daran sind die
          # fertigen Kandidaten gescheitert.
          if echo "$konten" | jq -e 'any(.bezeichnung == "Giro Demo Zwei")' >/dev/null; then
            echo "::error::Fremdes Konto sichtbar - die Zugriffskontrolle greift nicht."
            exit 1
          fi

          echo "Zugriffskontrolle greift."

      # Ohne diese Ausgabe ist ein Fehlschlag hier kaum zu deuten: "container X
      # is unhealthy" nennt weder den geprüften Befehl noch dessen Ausgabe.
      # Genau die steht in der Health-Historie.
      - name: Diagnose bei Fehlschlag
        if: failure()
        run: |
          echo "### Zustand der Container"
          docker compose -f docker-compose.ci.yml ps -a

          echo
          echo "### Health-Historie"
          for c in $(docker compose -f docker-compose.ci.yml ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c")
            echo "--- $name"
            docker inspect --format '{{json .State.Health}}' "$c" | jq '.' 2>/dev/null || echo "(kein Healthcheck)"
          done

          echo
          echo "### Protokolle"
          docker compose -f docker-compose.ci.yml logs --tail 200

      - name: Stapel stoppen
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ---------------------------------------------------------------------------
  images:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]

    # Nur hier, nicht am Workflow: Schreibrechte auf die Registry sollen so
    # wenige Jobs wie möglich haben.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/app/src/main/docker/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v5

      # Bewusst ohne docker/setup-buildx-action, docker/login-action und
      # docker/build-push-action: deren Auslieferung über codeload.github.com
      # antwortete wiederholt mit HTTP 429 und liess den Job umfallen, ohne dass
      # je ein Byte gebaut wurde.
      #
      # Docker und Buildx sind auf den Runnern vorinstalliert. Die paar Zeilen
      # Shell ersetzen die Actions vollständig - und hängen von nichts ab, das
      # erst heruntergeladen werden muss.
      - name: Buildx vorbereiten
        run: |
          docker buildx create --name haushaltsbuch --driver docker-container --use
          docker buildx inspect --bootstrap

      # Ein Pull Request aus einem Fork hat keinen Schreibzugriff auf die
      # Registry. Der Versuch würde den Lauf ohne Erkenntnisgewinn rot färben -
      # gebaut wird trotzdem, damit der Build selbst geprüft ist.
      - name: Kann gepusht werden?
        id: pushbar
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "wert=false" >> "$GITHUB_OUTPUT"
            echo "Fork-PR: Image wird gebaut, aber nicht gepusht."
          else
            echo "wert=true" >> "$GITHUB_OUTPUT"
          fi

      - name: An der Registry anmelden
        if: steps.pushbar.outputs.wert == 'true'
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Bauen und pushen
        run: |
          set -euo pipefail

          bild="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}"
          kurz="${GITHUB_SHA::7}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            basis="pr-${{ github.event.number }}"
          else
            basis="main"
          fi

          # Der SHA-Tag ist der eigentlich nützliche: der reine pr-42-Tag wird
          # mit jedem Push überschrieben. Will man später nachvollziehen, welches
          # Image zu einem bestimmten Stand gehörte, braucht man den
          # unveränderlichen.
          args=(--file '${{ matrix.dockerfile }}' --tag "${bild}:${basis}" --tag "${bild}:${basis}-${kurz}")

          # Registry-Cache statt type=gha: letzterer braucht Umgebungsvariablen,
          # die sonst setup-buildx-action setzt.
          args+=(--cache-from "type=registry,ref=${bild}:cache")

          if [ '${{ steps.pushbar.outputs.wert }}' = 'true' ]; then
            args+=(--push --cache-to "type=registry,ref=${bild}:cache,mode=max")
          fi

          docker buildx build "${args[@]}" '${{ matrix.context }}'

  # ---------------------------------------------------------------------------
  gate:
    name: Qualitätsgate
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, stapel, images]

    steps:
      # Ausdrücklich auf "success" prüfen, nicht mit "if: failure()" arbeiten:
      # ein übersprungener oder abgebrochener Job gilt sonst als bestanden.
      - name: Ergebnisse auswerten
        run: |
          ergebnisse="backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} stapel=${{ needs.stapel.result }} images=${{ needs.images.result }}"
          echo "$ergebnisse"

          for eintrag in $ergebnisse; do
            if [ "${eintrag#*=}" != "success" ]; then
              echo "::error::Nicht erfolgreich: $eintrag"
              exit 1
            fi
          done

          echo "Alle Prüfungen bestanden."
