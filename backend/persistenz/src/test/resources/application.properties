# =============================================================================
# Konfiguration der Tests dieses Moduls
#
# Die Zusagen des Ledgers stehen in der Datenbank: Row-Level-Security, die
# Splitsumme, die Zweiseitigkeit von Bewegungen. Keine davon laesst sich gegen
# eine In-Memory-Datenbank pruefen - keine kennt Row-Level-Security, und keine
# kennt CONSTRAINT TRIGGER ... DEFERRABLE. Dev Services startet deshalb echtes
# PostgreSQL.
# =============================================================================

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18-alpine
quarkus.datasource.devservices.db-name=haushaltsbuch

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration,db/demodaten
quarkus.flyway.clean-at-start=true

# Das Schema kommt aus Flyway, nicht aus Hibernate. Wuerde Hibernate es
# erzeugen, entstuenden die Tabellen ohne Policies - und die Zugriffskontrolle
# waere weg, ohne dass irgendetwas fehlschlaegt.
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.log.category."de.jbaconsult.haushaltsbuch".level=DEBUG
