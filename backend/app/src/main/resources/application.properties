# =============================================================================
# Haushaltsbuch - Anwendungskonfiguration
# =============================================================================

quarkus.application.name=haushaltsbuch
quarkus.http.port=8080


# -----------------------------------------------------------------------------
# Datenbank
#
# Eine einzige Datasource fuer alle Umgebungen. Flyway migriert beim Start unter
# der verbindenden Rolle; jede fachliche Transaktion wechselt danach per
# SET LOCAL ROLE in die eingeschraenkte Anwendungsrolle (siehe RlsKontext).
#
# Zwei unabhaengige Schutzschichten sorgen dafuer, dass das traegt:
#   1. Der Rollenwechsel pro Transaktion - wirkt auch gegen Superuser.
#   2. FORCE ROW LEVEL SECURITY - wirkt auch dann, wenn der Wechsel ausbleibt,
#      solange die Verbindung kein Superuser ist.
#
# Ausbaupfad fuer den produktiven Betrieb: Migration als eigener Schritt vor dem
# Anwendungsstart, Anwendung verbindet dauerhaft als haushaltsbuch_app. Dann
# entfaellt die Eigentuemerrolle zur Laufzeit ganz. Siehe doc/betrieb.
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Das Schema kommt aus Flyway, nicht aus Hibernate. Wuerde Hibernate es erzeugen,
# entstuenden die Tabellen ohne Policies - und die Zugriffskontrolle waere weg,
# ohne dass irgendetwas fehlschlaegt.
quarkus.hibernate-orm.schema-management.strategy=none


# -----------------------------------------------------------------------------
# MCP
#
# Laut HB-05 die primaere Schnittstelle des Systems.
# -----------------------------------------------------------------------------
quarkus.mcp.server.server-info.name=haushaltsbuch
quarkus.mcp.server.server-info.version=0.1.0


# -----------------------------------------------------------------------------
# OpenAPI
# -----------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Haushaltsbuch API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Dashboard-Schnittstelle. Die primaere Schnittstelle ist MCP.


# =============================================================================
# Profil: Entwicklung
# =============================================================================

# Dev Services startet Postgres selbst - keine Datenbank einrichten noetig.
%dev.quarkus.datasource.devservices.image-name=postgres:18-alpine
%dev.quarkus.datasource.devservices.db-name=haushaltsbuch

# Synthetischer Demo-Datensatz. Nie echte Werte - Zielbild ist Open Source.
%dev.quarkus.flyway.locations=db/migration,db/demodaten
%dev.quarkus.flyway.clean-at-start=true

# Ohne Anmeldung arbeiten. Einen Identity-Provider fuer jede Codeaenderung im Weg
# zu haben, kostet mehr als es prueft; die Zugriffskontrolle wird dort geprueft,
# wo sie hingehoert - im Test.
#
# Der Wert greift NUR in dev und test: BenutzerkontextFilter sperrt ihn ueber
# LaunchMode hart ab, statt sich darauf zu verlassen, dass die Property in
# Produktion ungesetzt bleibt.
%dev.quarkus.oidc.enabled=false
%dev.haushaltsbuch.entwicklung.benutzer-subjekt=demo-benutzer-eins

%dev.quarkus.log.category."de.jbaconsult.haushaltsbuch".level=DEBUG


# =============================================================================
# Profil: Test
# =============================================================================

%test.quarkus.datasource.devservices.image-name=postgres:18-alpine
%test.quarkus.flyway.locations=db/migration,db/demodaten
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.oidc.enabled=false
%test.haushaltsbuch.entwicklung.benutzer-subjekt=demo-benutzer-eins


# =============================================================================
# Profil: Produktion
# =============================================================================

%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}

# Kein Demo-Datensatz, kein clean-at-start. Letzteres wuerde die Datenbank beim
# Start leeren - in Produktion die teuerste denkbare Fehlkonfiguration.
%prod.quarkus.flyway.locations=db/migration
%prod.quarkus.flyway.clean-disabled=true

%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.application-type=service

# Anmeldung verlangt fuer alles ausser Health Checks. Die Reihenfolge zaehlt:
# permit-Regeln muessen vor der authenticate-Regel stehen.
%prod.quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
%prod.quarkus.http.auth.permission.health.policy=permit
%prod.quarkus.http.auth.permission.angemeldet.paths=/api/*,/mcp/*
%prod.quarkus.http.auth.permission.angemeldet.policy=authenticated
