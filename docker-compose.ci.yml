# =============================================================================
# Vollständiger Stack mit eigenem Identity-Provider
#
#   make hoch-ci
#
# Verwendet in zwei Fällen:
#   1. In der CI. Ein Pull Request, der rot wird, weil ein externer Keycloak
#      gerade neu startet, kostet mehr Vertrauen in die Pipeline, als die
#      Realitätsnähe wert ist. Eine Pipeline, der man nicht glaubt, wird
#      ignoriert - und ist damit wertlos.
#   2. Lokal, wenn auth.jbaconsult.com nicht erreichbar ist.
#
# Eigenständige Datei, kein Overlay: alle Zugangsdaten sind bewusst offene
# Testwerte, und die dürfen nicht versehentlich in den Entwicklungsstack
# geraten. Ein "docker compose -f a.yml -f b.yml" mit halb überschriebenen
# Geheimnissen ist genau die Art Konfiguration, bei der so etwas passiert.
#
# Anmeldung: demo-eins / ci-passwort, demo-zwei / ci-passwort
# =============================================================================

name: haushaltsbuch-ci

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: haushaltsbuch
      POSTGRES_USER: haushaltsbuch_eigentuemer
      POSTGRES_PASSWORD: ci-passwort
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haushaltsbuch_eigentuemer -d haushaltsbuch"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ci-passwort
      KC_HEALTH_ENABLED: "true"
      # Der Aussteller im Token muss zu der Adresse passen, unter der das
      # Backend den Realm prüft. Ohne diese Zeile trägt das Token die Adresse
      # ein, über die der Browser kam - und die Prüfung scheitert mit einer
      # Meldung, die nach einem Schlüsselproblem aussieht.
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      # Der Management-Port 9000 trägt seit Keycloak 25 die Health-Endpunkte.
      # Das Image bringt weder curl noch wget mit, deshalb der Umweg über die
      # Bash-eigene Netzwerkumleitung.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: app/src/main/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: haushaltsbuch
      POSTGRES_USER: haushaltsbuch_eigentuemer
      POSTGRES_PASSWORD: ci-passwort

      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/haushaltsbuch
      OIDC_CLIENT_ID: haushaltsbuch-backend
      OIDC_CLIENT_SECRET: ci-geheimnis-backend
    ports:
      - "8080:8080"

  # Spielt den synthetischen Demo-Datensatz ein. Ohne ihn fehlt die Zuordnung
  # der Keycloak-Benutzerkennungen auf die fachlichen Benutzer, und wer sich
  # anmeldet, sieht nichts - fail-closed, wie vorgesehen.
  #
  # Warum ein eigener Dienst und nicht einfach QUARKUS_FLYWAY_LOCATIONS:
  # quarkus.flyway.locations ist eine BUILD-ZEIT-Property. Eine
  # Umgebungsvariable ändert sie nicht; Quarkus meldet beim Start lediglich
  # "build time fixed to 'db/migration'" und macht weiter. Der Demo-Datensatz
  # bliebe stillschweigend aus.
  #
  # Der eigene Dienst hat einen zweiten Vorteil: das Produktionsimage kennt
  # keine Demodaten. Sie können nicht versehentlich in eine echte Umgebung
  # geraten.
  #
  # Läuft über "profiles" nicht bei "docker compose up" mit, sondern nur auf
  # ausdrücklichen Aufruf:
  #   docker compose -f docker-compose.ci.yml run --rm demodaten
  demodaten:
    image: postgres:18-alpine
    profiles: ["werkzeug"]
    depends_on:
      backend:
        # Erst wenn das Backend gesund ist, sind die Tabellen aus V1 da.
        condition: service_healthy
    environment:
      PGPASSWORD: ci-passwort
    volumes:
      - ./backend/persistenz/src/main/resources/db/demodaten:/demodaten:ro
    command: >
      psql -h postgres -U haushaltsbuch_eigentuemer -d haushaltsbuch
           -v ON_ERROR_STOP=1 -f /demodaten/V900__demodaten.sql

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_BASE_URL: http://backend:8080

      # Zwei Adressen fuer denselben Keycloak, und das ist kein Versehen: der
      # Container erreicht ihn unter keycloak:8080, der Browser auf dem Rechner
      # unter localhost:8081. Ohne die zweite Angabe leitet die Anmeldung den
      # Browser auf einen Namen, den nur Container aufloesen koennen, und endet
      # in "Server nicht gefunden". Tokentausch, Auffrischung, Abmeldung und der
      # Aussteller-Vergleich laufen weiter ueber die interne Adresse.
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/haushaltsbuch
      OIDC_BROWSER_URL: http://localhost:8081/realms/haushaltsbuch

      BFF_CLIENT_ID: haushaltsbuch-bff
      BFF_CLIENT_SECRET: ci-geheimnis-bff
      # Offener Testwert wie alle Zugangsdaten dieser Datei. In Produktion:
      # openssl rand -base64 32
      BFF_SESSION_SECRET: ci-sitzungsgeheimnis-nicht-fuer-den-betrieb
      BFF_BASIS_URL: http://localhost:3000
    ports:
      - "3000:3000"
